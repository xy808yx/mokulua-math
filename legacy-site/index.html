<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mokulua Math">
    <meta name="theme-color" content="#1a0a2e">
    <meta name="robots" content="noindex">
    <title>Mokulua Math</title>
    <link rel="canonical" href="https://xy808yx.github.io/mokulua-math/">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; background: #1a0a2e; }
        body { color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        main { padding: 32px; }
        a { color: #ffd93d; }
        iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
    <script>
        const destination = new URL('/mokulua-math/', location.origin);
        destination.search = location.search;
        destination.hash = location.hash;
        const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (standalone) {
            // Keep older Home Screen installs inside their original navigation scope.
            document.addEventListener('DOMContentLoaded', () => {
                const game = document.createElement('iframe');
                game.title = 'Mokulua Math';
                game.allow = 'autoplay; fullscreen';
                game.src = destination.href;
                document.body.replaceChildren(game);
            });
        } else {
            location.replace(destination.href);
        }
    </script>
</head>
<body>
    <main>
        <h1>Mokulua Math</h1>
        <p>The game has a new name and home.</p>
        <p><a href="../mokulua-math/">Open Mokulua Math</a></p>
    </main>
</body>
</html>
